{% extends "admin/base.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .cv-dashboard-shortcut {
            display: inline-block;
            margin: 0 0 10px 10px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 4px;
            color: #fff !important;
            font-weight: 600;
            text-decoration: none;
        }
        .cv-dashboard-shortcut:hover,
        .cv-dashboard-shortcut:focus {
            background: rgba(255, 255, 255, .12);
        }
    </style>
{% endblock %}

{% block branding %}
    <div id="site-name">
        <a href="{% url 'admin:index' %}">{{ site_header }}</a>
    </div>
    <a class="cv-dashboard-shortcut" href="{% url 'dashboard_login' %}">CV Studio dashboard · CV content</a>
{% endblock %}
